
services:
  php:
    ports:
      - "8080:80"
    build: .
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
  mysql:
    image: mysql:latest
    container_name: bobDB
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=supersecretpassword
      - MYSQL_DATABASE=bobDB
    volumes:
      - ./db:/var/lib/mysql
    restart: always
  
    